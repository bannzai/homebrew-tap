name: audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # checkout を tap として登録し trust するところまでこのアクションが行う。
      # master 参照は「同期を止めてエラーにする」と警告されるためコミットで固定する
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

      - name: Audit casks
        run: brew audit --cask bannzai/tap/puts
